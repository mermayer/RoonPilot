<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">Architektur der RoonPilot IR Bridge</title>
  <desc id="desc">Der Roon Core kommuniziert per WLAN mit RoonPilot. RoonPilot steuert die optionale IR Bridge über Bluetooth oder WLAN. Die Bridge sendet Infrarotbefehle an Audiogeräte.</desc>
  <defs><style>
    .bg{fill:#090b0b}.card{fill:#101412;stroke:#34403c;stroke-width:2}.pilot{stroke:#5ce0e1}.bridge{stroke:#f6b84a}.title{fill:#f7f6f2;font:700 27px Arial,sans-serif}.copy{fill:#a9afab;font:17px Arial,sans-serif}.small{fill:#7f8883;font:14px Arial,sans-serif}.cyan{fill:#5ce0e1}.amber{fill:#f6b84a}.line{stroke:#5ce0e1;stroke-width:3;fill:none}.dash{stroke-dasharray:9 9}.ir{stroke:#f6b84a;stroke-width:3;fill:none}.pill{fill:#0c1b1a;stroke:#3f9495}.pill2{fill:#241b0c;stroke:#9a7229}.pilltxt{fill:#f7f6f2;font:700 14px Arial,sans-serif}.num{fill:#090b0b;font:700 16px Arial,sans-serif}
  </style><marker id="cyanArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5ce0e1"/></marker><marker id="amberArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f6b84a"/></marker></defs>
  <rect class="bg" width="1400" height="520" rx="24"/>
  <text class="title" x="55" y="58">Ein Bedienweg – mit vollständig optionaler IR-Erweiterung</text>
  <text class="copy" x="55" y="88">RoonPilot bleibt die einzige Bedienoberfläche. Die Bridge benötigt keine eigene App, kein Konto und keine eigene Webseite.</text>
  <g transform="translate(52 142)"><rect class="card" width="245" height="230" rx="18"/><circle class="cyan" cx="38" cy="38" r="17"/><text class="num" x="33" y="44">1</text><text class="title" x="25" y="91">Roon Server</text><text class="copy" x="25" y="126">Musikbibliothek,</text><text class="copy" x="25" y="151">Wiedergabe und Zonen</text><text class="small" x="25" y="196">Lokales Netzwerk</text></g>
  <path class="line" d="M300 257 H405" marker-end="url(#cyanArrow)"/><rect class="pill" x="315" y="218" width="78" height="30" rx="15"/><text class="pilltxt" x="337" y="238">WLAN</text>
  <g transform="translate(420 142)"><rect class="card pilot" width="245" height="230" rx="18"/><circle cx="122" cy="58" r="34" fill="none" stroke="#5ce0e1" stroke-width="5"/><text class="title" x="25" y="126">RoonPilot</text><text class="copy" x="25" y="159">Display, Ring, Touch</text><text class="copy" x="25" y="184">und alle Einstellungen</text><text class="small" x="25" y="211">Immer die Zentrale</text></g>
  <path class="line dash" d="M668 225 H772" marker-end="url(#cyanArrow)"/><path class="line" d="M772 289 H668" marker-end="url(#cyanArrow)"/><rect class="pill" x="677" y="238" width="88" height="31" rx="15"/><text class="pilltxt" x="700" y="259">BLE</text><rect class="pill" x="676" y="302" width="90" height="31" rx="15"/><text class="pilltxt" x="694" y="323">WLAN</text>
  <g transform="translate(786 142)"><rect class="card bridge" width="245" height="230" rx="18"/><rect x="83" y="27" width="79" height="62" rx="12" fill="#171a18" stroke="#f6b84a" stroke-width="3"/><circle class="amber" cx="103" cy="58" r="7"/><path d="M137 51 q22 8 0 16" fill="none" stroke="#f6b84a" stroke-width="4"/><text class="title" x="25" y="126">IR Bridge</text><text class="copy" x="25" y="159">Speichert Profile lokal</text><text class="copy" x="25" y="184">und sendet IR</text><text class="small" x="25" y="211">Optionales ESP32-S3-Gerät</text></g>
  <path class="ir" d="M1034 257 H1138" marker-end="url(#amberArrow)"/><rect class="pill2" x="1054" y="218" width="65" height="30" rx="15"/><text class="pilltxt" x="1076" y="238">IR</text>
  <g transform="translate(1152 142)"><rect class="card" width="196" height="230" rx="18"/><text class="title" x="24" y="66">Audio-</text><text class="title" x="24" y="98">hardware</text><text class="copy" x="24" y="142">DAC</text><text class="copy" x="24" y="168">Verstärker</text><text class="copy" x="24" y="194">Streamer</text></g>
  <g transform="translate(52 413)"><circle class="cyan" cx="10" cy="10" r="6"/><text class="small" x="28" y="16">BLE bleibt bei stabiler Verbindung bevorzugt</text><circle class="cyan" cx="363" cy="10" r="6"/><text class="small" x="381" y="16">Optionales WLAN erweitert die Reichweite und wird für Firmware bevorzugt</text><circle class="amber" cx="941" cy="10" r="6"/><text class="small" x="959" y="16">„Bridge &amp; Bluetooth“ aus stoppt nach Neustart alle Bridge-Aktivität</text></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="570" viewBox="0 0 1400 570" role="img" aria-labelledby="title desc">
  <title id="title">Bridge-Kopplung und optionaler WLAN-Fallback</title>
  <desc id="desc">Eine neue Bridge sendet eine eindeutige Kennung. RoonPilot koppelt per Bluetooth, kann WLAN-Zugangsdaten verschlüsselt übertragen und wählt später Bluetooth oder WLAN automatisch.</desc>
  <defs><style>.bg{fill:#090b0b}.card{fill:#101412;stroke:#34403c;stroke-width:2}.h1{fill:#f7f6f2;font:700 28px Arial,sans-serif}.h2{fill:#f7f6f2;font:700 18px Arial,sans-serif}.body{fill:#a9afab;font:16px Arial,sans-serif}.small{fill:#7f8883;font:14px Arial,sans-serif}.cyan{fill:#5ce0e1}.amber{fill:#f6b84a}.green{fill:#65d58a}.line{stroke:#5ce0e1;stroke-width:3;fill:none}.num{fill:#090b0b;font:700 16px Arial,sans-serif}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#5ce0e1"/></marker></defs>
  <rect class="bg" width="1400" height="570" rx="24"/><text class="h1" x="50" y="55">Einmal per Bluetooth koppeln. WLAN nur bei Bedarf ergänzen.</text><text class="body" x="50" y="86">RoonPilot führt durch alle Schritte; die Bridge besitzt keine separate Konfigurationsoberfläche.</text>
  <g transform="translate(48 125)"><rect class="card" width="235" height="285" rx="18"/><circle class="cyan" cx="35" cy="36" r="17"/><text class="num" x="30" y="42">1</text><text class="h2" x="25" y="83">Neue Bridge startet</text><text class="body" x="25" y="115">LED pulsiert blau.</text><text class="body" x="25" y="144">Eindeutige Kennung:</text><rect x="25" y="163" width="184" height="40" rx="9" fill="#0c1b1a" stroke="#5ce0e1"/><text class="h2 cyan" x="48" y="189">RPB-DEMO-A</text><text class="small" x="25" y="235">Bereits einmal gekoppelt?</text><text class="small" x="25" y="258">3× in 15 Sekunden aus/ein:</text><text class="small" x="25" y="279">Pairing für 5 Minuten offen.</text></g>
  <path class="line" d="M286 267h63" marker-end="url(#a)"/>
  <g transform="translate(365 125)"><rect class="card" width="235" height="285" rx="18"/><circle class="cyan" cx="35" cy="36" r="17"/><text class="num" x="30" y="42">2</text><text class="h2" x="25" y="83">In RoonPilot suchen</text><text class="body" x="25" y="115">RPB-Kennung vergleichen.</text><text class="body" x="25" y="144">Bewusst auswählen.</text><text class="small" x="25" y="188">Die Suche pausiert die</text><text class="small" x="25" y="210">Bridge-Steuerung. Abbrechen</text><text class="small" x="25" y="232">kehrt zur Zone zurück.</text><rect x="25" y="252" width="184" height="33" rx="16" fill="#0c1b1a" stroke="#5ce0e1"/><text class="h2 cyan" x="65" y="275">Bridge koppeln</text></g>
  <path class="line" d="M603 267h63" marker-end="url(#a)"/>
  <g transform="translate(682 125)"><rect class="card" width="235" height="285" rx="18"/><circle class="green" cx="35" cy="36" r="17"/><text class="num" x="30" y="42">3</text><text class="h2" x="25" y="83">Verschlüsselt gekoppelt</text><text class="body" x="25" y="115">Schlüssel bleiben lokal.</text><text class="body" x="25" y="144">Normale Steuerung per BLE.</text><text class="small" x="25" y="188">„Gekoppelt“ bedeutet nicht</text><text class="small" x="25" y="210">immer „verbunden“. Gespeicherte</text><text class="small" x="25" y="232">Bridges warten bis sie nötig sind.</text><circle class="green" cx="34" cy="267" r="7"/><text class="h2" x="52" y="274">Bereit per BLE</text></g>
  <path class="line" d="M920 267h63" marker-end="url(#a)"/>
  <g transform="translate(999 125)"><rect class="card" width="353" height="285" rx="18"/><circle class="amber" cx="35" cy="36" r="17"/><text class="num" x="30" y="42">4</text><text class="h2" x="25" y="83">Optional: WLAN erlauben</text><text class="body" x="25" y="115">RoonPilot überträgt gespeicherte</text><text class="body" x="25" y="140">WLAN-Daten verschlüsselt per BLE.</text><line x1="25" y1="163" x2="328" y2="163" stroke="#34403c"/><text class="h2 cyan" x="25" y="197">Alltagssteuerung</text><text class="small" x="25" y="220">BLE bleibt bei Stabilität bevorzugt.</text><text class="h2 amber" x="25" y="252">Fallback / Firmwareupdate</text><text class="small" x="25" y="275">WLAN erweitert Reichweite und beschleunigt Transfer.</text></g>
  <g transform="translate(48 449)"><rect class="card" width="1304" height="78" rx="16"/><text class="h2" x="24" y="32">Was passiert bei einer Verbindungsstörung?</text><text class="body" x="24" y="58">RoonPilot wechselt erst nach stabilen Schwellen, verhindert doppelte IR-Befehle, verbindet unauffällig neu und zeigt den aktiven Weg auf der Bridge-Seite und im Quickmenü.</text></g>
</svg>

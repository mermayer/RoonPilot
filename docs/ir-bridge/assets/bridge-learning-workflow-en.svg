<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="465" viewBox="0 0 1320 465" role="img" aria-labelledby="title desc">
  <title id="title">Learn an independent IR profile and deploy it to another Bridge</title>
  <desc id="desc">Create the profile in RoonPilot's library first. Any paired Bridge with an IR receiver can capture each command twice. Saving commits the captures to RoonPilot. When a zone route is saved, the profile is automatically deployed to the selected target Bridge, which may be different.</desc>
  <style>.bg{fill:#0b0e0d}.card{fill:#171d1a;stroke:#405148;stroke-width:2}.h{fill:#f7f7f2;font:700 28px Arial,sans-serif}.sub{fill:#b8c5ba;font:18px Arial,sans-serif}.step{fill:#ffc461;font:700 17px Arial,sans-serif}.name{fill:#f7f7f2;font:700 21px Arial,sans-serif}.body{fill:#bbc7bd;font:17px Arial,sans-serif}.cyan{fill:#88e0df;font:700 18px Arial,sans-serif}.green{fill:#80dfa2;font:700 18px Arial,sans-serif}.line{stroke:#ffc461;stroke-width:3;fill:none}.note{fill:#f1dfb6;font:18px Arial,sans-serif}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ffc461"/></marker></defs>
  <rect class="bg" width="1320" height="465" rx="20"/>
  <text class="h" x="36" y="49">Learn once – deploy the profile to any target Bridge</text>
  <text class="sub" x="36" y="84">Only one Bridge needs an IR receiver; it learns profiles for every target Bridge.</text>
  <rect class="card" x="36" y="120" width="290" height="243" rx="17"/>
  <text class="step" x="57" y="155">1 · LIBRARY</text><text class="name" x="57" y="197">Name the profile</text>
  <text class="body" x="57" y="235">Save on RoonPilot.</text><text class="body" x="57" y="264">No Bridge needed yet.</text>
  <text class="cyan" x="57" y="329">One unique name</text>
  <path class="line" d="M330 239 H356" marker-end="url(#arrow)"/>
  <rect class="card" x="364" y="120" width="290" height="243" rx="17"/>
  <text class="step" x="385" y="155">2 · LEARNING BRIDGE</text><text class="name" x="385" y="197">Choose receiver</text>
  <text class="body" x="385" y="235">Any paired Bridge</text><text class="body" x="385" y="264">with an IR receiver.</text>
  <text class="cyan" x="385" y="329">Normal IR sending locked</text>
  <path class="line" d="M658 239 H684" marker-end="url(#arrow)"/>
  <rect class="card" x="692" y="120" width="290" height="243" rx="17"/>
  <text class="step" x="713" y="155">3 · CAPTURE</text><text class="name" x="713" y="197">Learn each key twice</text>
  <text class="body" x="713" y="235">Compare both captures.</text><text class="body" x="713" y="264">Then save on RoonPilot.</text>
  <text class="cyan" x="713" y="329">Auto-exit after 10 min</text>
  <path class="line" d="M986 239 H1012" marker-end="url(#arrow)"/>
  <rect class="card" x="1020" y="120" width="264" height="243" rx="17"/>
  <text class="step" x="1041" y="155">4 · ZONE ROUTE</text><text class="name" x="1041" y="197">Choose target</text>
  <text class="body" x="1041" y="235">Save deploys and verifies</text><text class="body" x="1041" y="264">the library profile.</text>
  <text class="green" x="1041" y="329">Reusable on many</text>
  <path d="M36 393 H1284" stroke="#405148" stroke-width="2"/>
  <text class="note" x="36" y="429">Example: Office learns through its receiver; Living Room later sends using the same profile.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="570" viewBox="0 0 1400 570" role="img" aria-labelledby="title desc">
  <title id="title">Bridge pairing and optional Wi-Fi fallback</title>
  <desc id="desc">A new Bridge advertises a unique identity. RoonPilot pairs by Bluetooth, can send Wi-Fi credentials over the encrypted connection, and later chooses Bluetooth or Wi-Fi automatically.</desc>
  <defs><style>.bg{fill:#090b0b}.card{fill:#101412;stroke:#34403c;stroke-width:2}.h1{fill:#f7f6f2;font:700 28px Arial,sans-serif}.h2{fill:#f7f6f2;font:700 18px Arial,sans-serif}.body{fill:#a9afab;font:16px Arial,sans-serif}.small{fill:#7f8883;font:14px Arial,sans-serif}.cyan{fill:#5ce0e1}.amber{fill:#f6b84a}.green{fill:#65d58a}.line{stroke:#5ce0e1;stroke-width:3;fill:none}.amberline{stroke:#f6b84a;stroke-width:3;fill:none}.num{fill:#090b0b;font:700 16px Arial,sans-serif}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#5ce0e1"/></marker></defs>
  <rect class="bg" width="1400" height="570" rx="24"/><text class="h1" x="50" y="55">Pair once by Bluetooth. Add Wi-Fi only when you need more range.</text><text class="body" x="50" y="86">RoonPilot performs every step; the Bridge never exposes a separate configuration interface.</text>
  <g transform="translate(48 125)"><rect class="card" width="235" height="285" rx="18"/><circle class="cyan" cx="35" cy="36" r="17"/><text class="num" x="30" y="42">1</text><text class="h2" x="25" y="83">New Bridge starts</text><text class="body" x="25" y="115">Blue LED pulses.</text><text class="body" x="25" y="144">Unique printed identity:</text><rect x="25" y="163" width="184" height="40" rx="9" fill="#0c1b1a" stroke="#5ce0e1"/><text class="h2 cyan" x="48" y="189">RPB-DEMO-A</text><text class="small" x="25" y="235">Previously paired unit?</text><text class="small" x="25" y="258">Power-cycle 3× within</text><text class="small" x="25" y="279">15 seconds for 5 minutes.</text></g>
  <path class="line" d="M286 267h63" marker-end="url(#a)"/>
  <g transform="translate(365 125)"><rect class="card" width="235" height="285" rx="18"/><circle class="cyan" cx="35" cy="36" r="17"/><text class="num" x="30" y="42">2</text><text class="h2" x="25" y="83">Scan in RoonPilot</text><text class="body" x="25" y="115">Compare the RPB identity.</text><text class="body" x="25" y="144">Select deliberately.</text><text class="small" x="25" y="188">Scanning pauses Bridge</text><text class="small" x="25" y="210">control temporarily. Cancel</text><text class="small" x="25" y="232">returns to zone control.</text><rect x="25" y="252" width="184" height="33" rx="16" fill="#0c1b1a" stroke="#5ce0e1"/><text class="h2 cyan" x="69" y="275">Pair Bridge</text></g>
  <path class="line" d="M603 267h63" marker-end="url(#a)"/>
  <g transform="translate(682 125)"><rect class="card" width="235" height="285" rx="18"/><circle class="green" cx="35" cy="36" r="17"/><text class="num" x="30" y="42">3</text><text class="h2" x="25" y="83">Encrypted bond</text><text class="body" x="25" y="115">Keys stay on both devices.</text><text class="body" x="25" y="144">Normal control uses BLE.</text><text class="small" x="25" y="188">Pairing is not the same as</text><text class="small" x="25" y="210">being connected. Saved units</text><text class="small" x="25" y="232">may be offline until needed.</text><circle class="green" cx="34" cy="267" r="7"/><text class="h2" x="52" y="274">Ready via BLE</text></g>
  <path class="line" d="M920 267h63" marker-end="url(#a)"/>
  <g transform="translate(999 125)"><rect class="card" width="353" height="285" rx="18"/><circle class="amber" cx="35" cy="36" r="17"/><text class="num" x="30" y="42">4</text><text class="h2" x="25" y="83">Optional: allow Wi-Fi</text><text class="body" x="25" y="115">RoonPilot sends its saved network</text><text class="body" x="25" y="140">credentials through encrypted BLE.</text><line x1="25" y1="163" x2="328" y2="163" stroke="#34403c"/><text class="h2 cyan" x="25" y="197">Daily control</text><text class="small" x="25" y="220">BLE stays preferred while stable.</text><text class="h2 amber" x="25" y="252">Fallback / firmware update</text><text class="small" x="25" y="275">Wi-Fi extends range and is preferred for transfer.</text></g>
  <g transform="translate(48 449)"><rect class="card" width="1304" height="78" rx="16"/><text class="h2" x="24" y="32">What happens when a transport fails?</text><text class="body" x="24" y="58">RoonPilot changes path only after stable thresholds, avoids duplicate IR commands, reconnects in the background and reports the active transport on the Bridge page and device Quick Menu.</text></g>
</svg>

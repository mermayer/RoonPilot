<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="530" viewBox="0 0 1400 530" role="img" aria-labelledby="title desc">
  <title id="title">Safe online update path for the IR Bridge</title>
  <desc id="desc">RoonPilot discovers a Bridge update, waits for manual confirmation, verifies compatibility and signatures, transfers by Wi-Fi or Bluetooth, then confirms the restarted Bridge version.</desc>
  <defs><style>.bg{fill:#090b0b}.card{fill:#101412;stroke:#34403c;stroke-width:2}.h1{fill:#f7f6f2;font:700 28px Arial,sans-serif}.h2{fill:#f7f6f2;font:700 17px Arial,sans-serif}.body{fill:#a9afab;font:15px Arial,sans-serif}.small{fill:#7f8883;font:13px Arial,sans-serif}.cyan{fill:#5ce0e1}.amber{fill:#f6b84a}.green{fill:#65d58a}.line{stroke:#5ce0e1;stroke-width:3;fill:none}.num{fill:#090b0b;font:700 15px Arial,sans-serif}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#5ce0e1"/></marker></defs>
  <rect class="bg" width="1400" height="530" rx="24"/><text class="h1" x="50" y="55">Bridge online updates are managed by RoonPilot—and always started manually</text><text class="body" x="50" y="84">If Bridge &amp; Bluetooth is off, no Bridge check, notice, connection or transfer runs.</text>
  <g transform="translate(48 130)"><rect class="card" width="190" height="245" rx="16"/><circle class="cyan" cx="30" cy="31" r="15"/><text class="num" x="26" y="36">1</text><text class="h2" x="22" y="73">Check</text><text class="body" x="22" y="105">RoonPilot reads the</text><text class="body" x="22" y="128">approved manifest.</text><text class="small" x="22" y="173">Startup + at most daily</text><text class="small" x="22" y="195">when enabled</text></g><path class="line" d="M241 251h31" marker-end="url(#a)"/>
  <g transform="translate(285 130)"><rect class="card" width="190" height="245" rx="16"/><circle class="amber" cx="30" cy="31" r="15"/><text class="num" x="26" y="36">2</text><text class="h2" x="22" y="73">Notify</text><text class="body" x="22" y="105">Web status bar and</text><text class="body" x="22" y="128">optional daily display</text><text class="body" x="22" y="151">notice.</text><text class="small" x="22" y="195">Nothing installs yet</text></g><path class="line" d="M478 251h31" marker-end="url(#a)"/>
  <g transform="translate(522 130)"><rect class="card" width="190" height="245" rx="16"/><circle class="amber" cx="30" cy="31" r="15"/><text class="num" x="26" y="36">3</text><text class="h2" x="22" y="73">Confirm</text><text class="body" x="22" y="105">The user selects</text><text class="body" x="22" y="128">Download and install.</text><text class="small" x="22" y="173">Keep both devices</text><text class="small" x="22" y="195">powered</text></g><path class="line" d="M715 251h31" marker-end="url(#a)"/>
  <g transform="translate(759 130)"><rect class="card" width="190" height="245" rx="16"/><circle class="cyan" cx="30" cy="31" r="15"/><text class="num" x="26" y="36">4</text><text class="h2" x="22" y="73">Verify + transfer</text><text class="body" x="22" y="105">Project, board, protocol,</text><text class="body" x="22" y="128">version, size, SHA-256</text><text class="body" x="22" y="151">and signature.</text><text class="small" x="22" y="195">Wi-Fi preferred · BLE fallback</text></g><path class="line" d="M952 251h31" marker-end="url(#a)"/>
  <g transform="translate(996 130)"><rect class="card" width="190" height="245" rx="16"/><circle class="cyan" cx="30" cy="31" r="15"/><text class="num" x="26" y="36">5</text><text class="h2" x="22" y="73">Write inactive slot</text><text class="body" x="22" y="105">The Bridge verifies</text><text class="body" x="22" y="128">again before switching</text><text class="body" x="22" y="151">its A/B partition.</text><text class="small" x="22" y="195">Local rollback remains possible</text></g><path class="line" d="M1189 251h31" marker-end="url(#a)"/>
  <g transform="translate(1233 130)"><rect class="card" width="119" height="245" rx="16"/><circle class="green" cx="30" cy="31" r="15"/><text class="num" x="26" y="36">6</text><text class="h2" x="18" y="73">Confirm</text><text class="body" x="18" y="105">Restart,</text><text class="body" x="18" y="128">reconnect,</text><text class="body" x="18" y="151">report exact</text><text class="body" x="18" y="174">version.</text></g>
  <g transform="translate(48 414)"><rect class="card" width="1304" height="75" rx="16"/><text class="h2" x="24" y="31">Firmware order is guarded by compatibility metadata</text><text class="body" x="24" y="55">Update RoonPilot or the Bridge first when both approved releases declare mutual compatibility. If they do not, RoonPilot blocks the unsafe step instead of disconnecting the pair.</text></g>
</svg>

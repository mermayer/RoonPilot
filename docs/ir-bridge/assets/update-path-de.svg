<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="530" viewBox="0 0 1400 530" role="img" aria-labelledby="title desc">
  <title id="title">Sicherer Onlineupdate-Pfad für die IR Bridge</title>
  <desc id="desc">RoonPilot findet ein Bridge-Update, wartet auf manuelle Bestätigung, prüft Kompatibilität und Signaturen, überträgt per WLAN oder Bluetooth und bestätigt danach die neu gestartete Bridge-Version.</desc>
  <defs><style>.bg{fill:#090b0b}.card{fill:#101412;stroke:#34403c;stroke-width:2}.h1{fill:#f7f6f2;font:700 28px Arial,sans-serif}.h2{fill:#f7f6f2;font:700 17px Arial,sans-serif}.body{fill:#a9afab;font:15px Arial,sans-serif}.small{fill:#7f8883;font:13px Arial,sans-serif}.cyan{fill:#5ce0e1}.amber{fill:#f6b84a}.green{fill:#65d58a}.line{stroke:#5ce0e1;stroke-width:3;fill:none}.num{fill:#090b0b;font:700 15px Arial,sans-serif}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#5ce0e1"/></marker></defs>
  <rect class="bg" width="1400" height="530" rx="24"/><text class="h1" x="50" y="55">Bridge-Onlineupdates werden von RoonPilot verwaltet – und immer manuell gestartet</text><text class="body" x="50" y="84">Ist „Bridge &amp; Bluetooth“ aus, erfolgen weder Prüfung noch Meldung, Verbindung oder Übertragung.</text>
  <g transform="translate(48 130)"><rect class="card" width="190" height="245" rx="16"/><circle class="cyan" cx="30" cy="31" r="15"/><text class="num" x="26" y="36">1</text><text class="h2" x="22" y="73">Prüfen</text><text class="body" x="22" y="105">RoonPilot liest das</text><text class="body" x="22" y="128">freigegebene Manifest.</text><text class="small" x="22" y="173">Beim Start + höchstens täglich</text><text class="small" x="22" y="195">wenn aktiviert</text></g><path class="line" d="M241 251h31" marker-end="url(#a)"/>
  <g transform="translate(285 130)"><rect class="card" width="190" height="245" rx="16"/><circle class="amber" cx="30" cy="31" r="15"/><text class="num" x="26" y="36">2</text><text class="h2" x="22" y="73">Hinweisen</text><text class="body" x="22" y="105">Statuszeile im Web und</text><text class="body" x="22" y="128">optionale tägliche</text><text class="body" x="22" y="151">Displaymeldung.</text><text class="small" x="22" y="195">Noch keine Installation</text></g><path class="line" d="M478 251h31" marker-end="url(#a)"/>
  <g transform="translate(522 130)"><rect class="card" width="190" height="245" rx="16"/><circle class="amber" cx="30" cy="31" r="15"/><text class="num" x="26" y="36">3</text><text class="h2" x="22" y="73">Bestätigen</text><text class="body" x="22" y="105">Der Nutzer wählt</text><text class="body" x="22" y="128">Herunterladen und</text><text class="body" x="22" y="151">installieren.</text><text class="small" x="22" y="195">Beide Geräte versorgen</text></g><path class="line" d="M715 251h31" marker-end="url(#a)"/>
  <g transform="translate(759 130)"><rect class="card" width="190" height="245" rx="16"/><circle class="cyan" cx="30" cy="31" r="15"/><text class="num" x="26" y="36">4</text><text class="h2" x="22" y="73">Prüfen + übertragen</text><text class="body" x="22" y="105">Projekt, Board, Protokoll,</text><text class="body" x="22" y="128">Version, Größe, SHA-256</text><text class="body" x="22" y="151">und Signatur.</text><text class="small" x="22" y="195">WLAN bevorzugt · BLE-Fallback</text></g><path class="line" d="M952 251h31" marker-end="url(#a)"/>
  <g transform="translate(996 130)"><rect class="card" width="190" height="245" rx="16"/><circle class="cyan" cx="30" cy="31" r="15"/><text class="num" x="26" y="36">5</text><text class="h2" x="22" y="73">Inaktiven Slot schreiben</text><text class="body" x="22" y="105">Die Bridge prüft erneut,</text><text class="body" x="22" y="128">bevor sie ihre A/B-</text><text class="body" x="22" y="151">Partition umschaltet.</text><text class="small" x="22" y="195">Lokales Rollback bleibt möglich</text></g><path class="line" d="M1189 251h31" marker-end="url(#a)"/>
  <g transform="translate(1233 130)"><rect class="card" width="119" height="245" rx="16"/><circle class="green" cx="30" cy="31" r="15"/><text class="num" x="26" y="36">6</text><text class="h2" x="18" y="73">Bestätigen</text><text class="body" x="18" y="105">Neustart,</text><text class="body" x="18" y="128">Verbinden,</text><text class="body" x="18" y="151">exakte</text><text class="body" x="18" y="174">Version.</text></g>
  <g transform="translate(48 414)"><rect class="card" width="1304" height="75" rx="16"/><text class="h2" x="24" y="31">Kompatibilitätsangaben sichern die Reihenfolge ab</text><text class="body" x="24" y="55">RoonPilot oder Bridge dürfen zuerst aktualisiert werden, wenn beide Freigaben kompatibel sind. Andernfalls blockiert RoonPilot den unsicheren Schritt, statt die Kopplung zu verlieren.</text></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Bedienablauf des RoonPilot-Gruppenmixers</title>
  <desc id="desc">Der erste Rastschritt öffnet den Gruppenmixer, ohne die Lautstärke zu ändern. Weiterdrehen steuert alle Gruppenmitglieder. Eine berührte Zeile wählt nur diesen Ausgang; die Kopfzeile wählt wieder die ganze Gruppe.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#5ce0e1"/></marker><style>.h{font:700 38px system-ui,sans-serif;fill:#f4f1e9}.n{font:700 20px system-ui,sans-serif;fill:#f4f1e9}.p{font:400 16px system-ui,sans-serif;fill:#a8aaa5}.box{fill:#141b1d;stroke:#394648;stroke-width:2}.hot{fill:#172729;stroke:#5ce0e1;stroke-width:3}.line{fill:none;stroke:#5ce0e1;stroke-width:4;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="620" rx="34" fill="#0a0f11"/><text x="60" y="68" class="h">Gruppenlautstärke ohne zusätzlichen Knopf</text>
  <rect x="60" y="145" width="230" height="250" rx="25" class="box"/><circle cx="175" cy="232" r="55" fill="none" stroke="#5ce0e1" stroke-width="12" stroke-dasharray="115 230"/><text x="175" y="320" text-anchor="middle" class="n">Erstes Raster</text><text x="175" y="350" text-anchor="middle" class="p">öffnet nur</text>
  <path d="M290 270H370" class="line"/><rect x="382" y="145" width="310" height="250" rx="25" class="hot"/><text x="414" y="187" class="p">GRUPPENLAUTSTÄRKE</text><text x="414" y="221" class="n">Demo Erdgeschoss</text><rect x="414" y="246" width="246" height="42" rx="12" fill="#243436"/><text x="434" y="273" class="p">WiiM Ultra</text><text x="641" y="273" text-anchor="end" class="n">IR +2</text><rect x="414" y="298" width="246" height="42" rx="12" fill="#1a2224"/><text x="434" y="325" class="p">Arbeitszimmer</text><text x="641" y="325" text-anchor="end" class="n">−35 dB</text><text x="537" y="373" text-anchor="middle" class="p">Weiterdrehen → ganze Gruppe</text>
  <path d="M692 270H772" class="line"/><rect x="784" y="145" width="356" height="250" rx="25" class="box"/><text x="816" y="187" class="p">EINZELLAUTSTÄRKE</text><text x="816" y="221" class="n">Demo Erdgeschoss</text><rect x="816" y="246" width="292" height="48" rx="12" fill="#40331e" stroke="#f4ae3f"/><text x="837" y="277" class="n">WiiM Ultra</text><text x="1087" y="277" text-anchor="end" class="n">IR +2</text><text x="962" y="330" text-anchor="middle" class="p">Zeile tippen, dann drehen</text><text x="962" y="363" text-anchor="middle" class="p">Kopfzeile → ganze Gruppe</text>
  <rect x="60" y="466" width="1080" height="88" rx="20" fill="#12191a" stroke="#394648"/><text x="90" y="500" class="n">Display aus?</text><text x="245" y="500" class="p">Das erste Raster weckt und öffnet den Mixer; es ändert niemals die Lautstärke.</text><text x="90" y="531" class="p">Nach 8 Sekunden ohne Bedienung schließt der Mixer. Bei schnellem Drehen wird nur das erste Raster verbraucht; der Rest wirkt auf die Gruppe.</text>
</svg>
